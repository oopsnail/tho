<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>단상</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F6F2EB;
    --card: #FFFFFF;
    --ink: #2B2620;
    --muted: #8A8271;
    --faint: #B7AF9C;
    --line: #E3DCCB;
    --accent: #6E4B5E;
    --accent-ink: #FFFFFF;
    --accent-soft: #EFE2E9;
    --danger: #A3402F;
    --yt: #C1443A;
    --serif: "Noto Serif KR", "Nanum Myeongjo", "Apple SD Gothic Neo", serif;
    --sans: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1C1815; --card: #262019; --ink: #EFE9DE; --muted: #A79E8C;
      --faint: #6E6656; --line: #3A332A; --accent: #D9A9C2; --accent-ink: #2B1A22;
      --accent-soft: #3A2B33; --danger: #E2897B; --yt: #E2897B;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1C1815; --card: #262019; --ink: #EFE9DE; --muted: #A79E8C;
    --faint: #6E6656; --line: #3A332A; --accent: #D9A9C2; --accent-ink: #2B1A22;
    --accent-soft: #3A2B33; --danger: #E2897B; --yt: #E2897B;
  }

  html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + 16px); }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { overflow-x: hidden; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 16px; line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 620px; margin: 0 auto; padding: 30px 20px 100px; }
  [hidden] { display: none !important; }

  h1 { font-family: var(--serif); font-weight: 700; font-size: 27px; letter-spacing: -0.01em; margin: 0; }
  .head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 22px; }
  .muted { color: var(--muted); font-size: 14px; }

  /* Month picker */
  .month-bar { position: relative; margin-bottom: 20px; }
  .month-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
    font: inherit; font-family: var(--serif); font-size: 17px; font-weight: 600;
    padding: 10px; border: 0.5px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--ink); cursor: pointer;
  }
  .month-btn .chev { width: 9px; height: 9px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(45deg); margin-top: -3px; }
  .month-menu {
    position: absolute; left: 0; right: 0; top: calc(100% + 6px); z-index: 20;
    max-height: 280px; overflow-y: auto; background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; box-shadow: 0 10px 28px rgba(0,0,0,.16); padding: 6px;
  }
  .month-menu[hidden] { display: none; }
  .month-menu button {
    display: flex; justify-content: space-between; width: 100%; text-align: left; border: 0; border-radius: 6px;
    padding: 10px 12px; font: inherit; font-size: 15px; background: transparent; color: var(--ink); cursor: pointer;
  }
  .month-menu button:hover { background: var(--accent-soft); }
  .month-menu button[aria-current="true"] { font-weight: 700; }
  .month-menu .mn { color: var(--muted); font-size: 13px; }

  /* Entry form */
  .panel {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 18px; display: grid; gap: 14px; margin-bottom: 8px;
  }
  .panel.editing { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  label { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 6px; }
  input[type="text"], input[type="date"], input[type="url"], textarea {
    width: 100%; min-width: 0; max-width: 100%; font: inherit; color: var(--ink); background: var(--paper);
    border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
    -webkit-appearance: none; appearance: none;
  }
  input[type="date"]::-webkit-date-and-time-value { text-align: left; }
  .date-wrap {
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--paper);
  }
  .date-wrap input[type="date"] {
    border: 0; border-radius: 0; background: transparent; display: block;
  }
  textarea { resize: vertical; min-height: 100px; line-height: 1.8; font-family: var(--serif); }
  input::placeholder, textarea::placeholder { color: var(--faint); }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  input:focus-visible, textarea:focus-visible { outline-offset: 0; border-color: var(--accent); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .error { color: var(--danger); font-size: 13px; min-height: 1em; }

  .photo-pick { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .photo-pick input[type="file"] { font-size: 13px; max-width: 100%; }
  .photo-preview { position: relative; width: 64px; height: 64px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); flex-shrink: 0; }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .photo-remove {
    position: absolute; top: 2px; right: 2px; width: 20px; height: 20px; border-radius: 50%;
    background: rgba(0,0,0,.6); color: #fff; border: 0; font-size: 13px; line-height: 1; cursor: pointer;
  }

  button {
    font: inherit; font-size: 15px; font-weight: 500; cursor: pointer;
    border-radius: 6px; padding: 9px 18px; border: 1px solid var(--line);
    background: transparent; color: var(--ink);
  }
  button:hover { border-color: var(--faint); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.primary:hover { filter: brightness(1.06); }
  button.small { padding: 4px 10px; font-size: 13px; }
  button.danger.armed { background: var(--danger); border-color: var(--danger); color: #fff; }

  /* Entry cards */
  .list { margin-top: 22px; }
  .entry { border: 1px solid var(--line); border-radius: 10px; margin-bottom: 10px; background: var(--card); overflow: hidden; }
  .entry-head {
    width: 100%; display: flex; align-items: center; gap: 10px; padding: 12px 14px;
    border: 0; background: transparent; color: var(--ink); cursor: pointer; text-align: left;
  }
  .entry-head:hover { background: var(--accent-soft); }
  .e-date { font-size: 12px; color: var(--muted); width: 46px; flex-shrink: 0; }
  .e-preview { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; font-family: var(--serif); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .e-badge { flex-shrink: 0; width: 15px; height: 15px; }
  .e-badge.photo { color: var(--muted); }
  .e-badge.video { color: var(--yt); }
  .e-chev { flex-shrink: 0; width: 8px; height: 8px; border-right: 2px solid var(--faint); border-bottom: 2px solid var(--faint); transform: rotate(45deg); transition: transform .15s; }
  .entry.open .e-chev { transform: rotate(-135deg); }

  .e-body { padding: 0 14px 14px 70px; display: none; }
  .entry.open .e-body { display: block; }
  .e-photo { width: 100%; max-height: 320px; object-fit: cover; border-radius: 8px; margin-bottom: 10px; display: block; background: var(--paper); }
  .e-video {
    display: block; position: relative; border-radius: 8px; overflow: hidden; margin-bottom: 10px;
    background: var(--paper); border: 1px solid var(--line); text-decoration: none; color: inherit;
  }
  .e-video img { width: 100%; display: block; aspect-ratio: 16/9; object-fit: cover; background: #000; }
  .e-video .play {
    position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  }
  .e-video .play span {
    width: 46px; height: 46px; border-radius: 50%; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
  }
  .e-video .play svg { width: 18px; height: 18px; fill: #fff; margin-left: 2px; }
  .e-video .vt { padding: 8px 10px; font-size: 12px; color: var(--muted); }
  .e-text { font-family: var(--serif); font-size: 15px; line-height: 1.85; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 12px; }
  .e-tools { display: flex; gap: 6px; }

  .empty { margin-top: 24px; padding: 32px 20px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 10px; }

  .dl { margin-top: 48px; padding-top: 18px; border-top: 1px solid var(--line); display: grid; gap: 12px; font-size: 14px; color: var(--muted); }
  .dl p { margin: 0; }
  details.backup summary { cursor: pointer; }
  details.backup .inner { margin-top: 12px; display: grid; gap: 10px; }
  details.backup textarea { font-size: 13px; min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; }

  @media (max-width: 480px) {
    h1 { font-size: 23px; }
    .two { grid-template-columns: 1fr; }
    .e-body { padding-left: 14px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>단상</h1>
    <span class="muted" id="count"></span>
  </div>

  <div class="month-bar">
    <button type="button" class="month-btn" id="month-btn" aria-haspopup="listbox" aria-expanded="false">
      <span id="month-label">이번 달</span><span class="chev" aria-hidden="true"></span>
    </button>
    <div class="month-menu" id="month-menu" role="listbox" hidden></div>
  </div>

  <div class="panel" id="form">
    <div>
      <label for="f-date">날짜</label>
      <div class="date-wrap"><input type="date" id="f-date"></div>
    </div>
    <div>
      <label for="f-text">오늘의 단상</label>
      <textarea id="f-text" placeholder="오늘 있었던 일이나 떠오른 생각을 적어 보세요"></textarea>
    </div>
    <div>
      <label for="f-photo-file">사진 (선택)</label>
      <div class="photo-pick">
        <input type="file" id="f-photo-file" accept="image/*">
        <div class="photo-preview" id="f-photo-preview" hidden>
          <img id="f-photo-img" alt="">
          <button type="button" class="photo-remove" id="f-photo-remove" aria-label="사진 삭제">×</button>
        </div>
      </div>
    </div>
    <div>
      <label for="f-video">유튜브 링크 (선택)</label>
      <input type="url" id="f-video" placeholder="https://www.youtube.com/watch?v=...">
    </div>
    <div class="error" id="err" role="alert"></div>
    <div class="row">
      <button class="primary" id="save">기록 저장</button>
      <button id="cancel" hidden>수정 취소</button>
    </div>
  </div>

  <div class="list" id="list"></div>

  <div class="dl">
    <p>모든 기록을 파일로 내려받아요.</p>
    <div class="row">
      <button id="dl-json">백업용 (JSON)</button>
      <span id="dl-msg" role="status"></span>
    </div>
    <details class="backup">
      <summary>백업 · 복원</summary>
      <div class="inner">
        <p>내용은 지금 쓰는 브라우저에만 저장돼요. 사진을 많이 넣으면 용량이 커지니, 가끔 백업해 두세요.</p>
        <textarea id="backup-text" placeholder="내보내기를 누르면 여기에 내용이 나타나요. 복원할 때는 백업(JSON) 내용을 여기에 붙여넣으세요."></textarea>
        <div class="row">
          <button id="export">내보내기</button>
          <button id="import">불러오기 (합치기)</button>
          <span id="backup-msg" role="status"></span>
        </div>
      </div>
    </details>
  </div>
</div>

<script>
(function () {
  var KEY = "my-journal-v1";
  var entries = [];
  var editingId = null;
  var openIds = {};
  var currentMonth = null; // "YYYY-MM"
  var pendingPhoto = null; // data URL staged for the form

  function $(id) { return document.getElementById(id); }
  function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function todayStr() {
    var d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function monthKey(dateStr) { return dateStr.slice(0, 7); }
  function monthLabel(key) {
    var p = key.split("-");
    return p[0] + "년 " + parseInt(p[1], 10) + "월";
  }
  function dayLabel(dateStr) {
    var p = dateStr.split("-");
    return parseInt(p[1], 10) + "/" + parseInt(p[2], 10);
  }

  /* ---------- storage ---------- */
  function load() {
    try {
      var raw = localStorage.getItem(KEY);
      if (raw) { var d = JSON.parse(raw); if (Array.isArray(d)) entries = d; }
    } catch (e) { entries = []; }
  }
  function persist() {
    try { localStorage.setItem(KEY, JSON.stringify(entries)); return true; }
    catch (e) { return false; }
  }

  /* ---------- youtube ---------- */
  function parseYoutube(url) {
    if (!url) return null;
    var m = url.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([A-Za-z0-9_-]{6,})/);
    return m ? m[1] : null;
  }

  /* ---------- month list ---------- */
  function allMonths() {
    var set = {};
    entries.forEach(function (e) { set[monthKey(e.date)] = true; });
    set[monthKey(todayStr())] = true;
    return Object.keys(set).sort().reverse();
  }
  function countInMonth(key) { return entries.filter(function (e) { return monthKey(e.date) === key; }).length; }

  /* ---------- render ---------- */
  function render() {
    var months = allMonths();
    if (!currentMonth || months.indexOf(currentMonth) === -1) currentMonth = months[0];
    $("month-label").textContent = monthLabel(currentMonth);
    $("count").textContent = entries.length ? "전체 기록 " + entries.length + "개" : "";
    renderMonthMenu(months);
    renderList();
  }

  function renderMonthMenu(months) {
    var menu = $("month-menu");
    menu.textContent = "";
    months.forEach(function (key) {
      var b = document.createElement("button");
      b.type = "button";
      b.setAttribute("role", "option");
      if (key === currentMonth) b.setAttribute("aria-current", "true");
      var n = countInMonth(key);
      b.innerHTML = "";
      var label = document.createElement("span");
      label.textContent = monthLabel(key);
      var mn = document.createElement("span");
      mn.className = "mn";
      mn.textContent = n ? n + "개" : "";
      b.appendChild(label); b.appendChild(mn);
      b.addEventListener("click", function () { currentMonth = key; closeMonthMenu(); render(); });
      menu.appendChild(b);
    });
  }
  function openMonthMenu() { $("month-menu").hidden = false; $("month-btn").setAttribute("aria-expanded", "true"); }
  function closeMonthMenu() { $("month-menu").hidden = true; $("month-btn").setAttribute("aria-expanded", "false"); }

  function renderList() {
    var box = $("list");
    box.textContent = "";
    var shown = entries.filter(function (e) { return monthKey(e.date) === currentMonth; })
      .sort(function (a, b) { return b.date === a.date ? (b.created || 0) - (a.created || 0) : (b.date < a.date ? -1 : 1); });

    if (!shown.length) {
      var e = document.createElement("div");
      e.className = "empty";
      e.textContent = "이 달에는 아직 기록이 없어요. 위에서 날짜를 고르고 첫 단상을 적어 보세요.";
      box.appendChild(e);
      return;
    }

    shown.forEach(function (entry) {
      var art = document.createElement("article");
      art.className = "entry" + (openIds[entry.id] ? " open" : "");

      var head = document.createElement("button");
      head.type = "button";
      head.className = "entry-head";
      var d = document.createElement("span"); d.className = "e-date"; d.textContent = dayLabel(entry.date);
      var prev = document.createElement("span"); prev.className = "e-preview";
      if (entry.photo) {
        var pi = document.createElement("i"); pi.className = "e-badge photo"; pi.innerHTML = photoIcon();
        prev.appendChild(pi);
      }
      var vid = parseYoutube(entry.video);
      if (vid) {
        var vi = document.createElement("i"); vi.className = "e-badge video"; vi.innerHTML = videoIcon();
        prev.appendChild(vi);
      }
      var txt = document.createElement("span");
      txt.textContent = entry.text || "(글 없음)";
      prev.appendChild(txt);
      var chev = document.createElement("span"); chev.className = "e-chev"; chev.setAttribute("aria-hidden", "true");
      head.appendChild(d); head.appendChild(prev); head.appendChild(chev);
      head.addEventListener("click", function () {
        openIds[entry.id] = !openIds[entry.id];
        art.classList.toggle("open", openIds[entry.id]);
      });

      var body = document.createElement("div");
      body.className = "e-body";
      if (entry.photo) {
        var img = document.createElement("img");
        img.className = "e-photo"; img.src = entry.photo; img.alt = "";
        body.appendChild(img);
      }
      if (vid) {
        var a = document.createElement("a");
        a.className = "e-video"; a.href = "https://www.youtube.com/watch?v=" + vid;
        a.target = "_blank"; a.rel = "noopener";
        var thumb = document.createElement("img");
        thumb.src = "https://img.youtube.com/vi/" + vid + "/hqdefault.jpg"; thumb.alt = "";
        var play = document.createElement("div"); play.className = "play";
        play.innerHTML = '<span><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></span>';
        var vt = document.createElement("div"); vt.className = "vt"; vt.textContent = "유튜브에서 보기";
        a.appendChild(thumb); a.appendChild(play); a.appendChild(vt);
        body.appendChild(a);
      }
      if (entry.text) {
        var p = document.createElement("p"); p.className = "e-text"; p.textContent = entry.text;
        body.appendChild(p);
      }
      var tools = document.createElement("div"); tools.className = "e-tools";
      var edit = document.createElement("button"); edit.className = "small"; edit.textContent = "수정";
      edit.addEventListener("click", function () { startEdit(entry.id); });
      var del = document.createElement("button"); del.className = "small danger"; del.textContent = "삭제";
      del.addEventListener("click", function () {
        if (del.classList.contains("armed")) {
          entries = entries.filter(function (x) { return x.id !== entry.id; });
          if (editingId === entry.id) resetForm();
          persist(); render();
        } else {
          del.classList.add("armed"); del.textContent = "정말 삭제";
          setTimeout(function () { del.classList.remove("armed"); del.textContent = "삭제"; }, 3000);
        }
      });
      tools.appendChild(edit); tools.appendChild(del);
      body.appendChild(tools);

      art.appendChild(head); art.appendChild(body);
      box.appendChild(art);
    });
  }

  function photoIcon() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="1.6"/><path d="M21 17l-5.5-5.5-3 3L9 11l-6 6"/></svg>'; }
  function videoIcon() { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="5" width="15" height="14" rx="2"/><path d="M22 9l-5 3 5 3V9z"/></svg>'; }

  /* ---------- form ---------- */
  function setPending(dataUrl) {
    pendingPhoto = dataUrl;
    $("f-photo-preview").hidden = !dataUrl;
    if (dataUrl) $("f-photo-img").src = dataUrl;
  }
  $("f-photo-file").addEventListener("change", function (ev) {
    var file = ev.target.files && ev.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () { setPending(reader.result); };
    reader.readAsDataURL(file);
  });
  $("f-photo-remove").addEventListener("click", function () {
    setPending(null); $("f-photo-file").value = "";
  });

  function resetForm() {
    editingId = null;
    $("f-date").value = todayStr();
    $("f-text").value = ""; $("f-video").value = ""; $("f-photo-file").value = "";
    setPending(null);
    $("form").classList.remove("editing");
    $("save").textContent = "기록 저장";
    $("cancel").hidden = true;
    $("err").textContent = "";
  }

  function save() {
    var date = $("f-date").value || todayStr();
    var text = $("f-text").value.trim();
    var video = $("f-video").value.trim();
    if (!text && !pendingPhoto && !video) {
      $("err").textContent = "글이나 사진, 영상 링크 중 하나는 있어야 해요.";
      $("f-text").focus();
      return;
    }
    $("err").textContent = "";
    if (editingId) {
      entries.forEach(function (e) {
        if (e.id === editingId) { e.date = date; e.text = text; e.video = video; e.photo = pendingPhoto; }
      });
    } else {
      entries.push({ id: newId(), date: date, text: text, video: video, photo: pendingPhoto, created: Date.now() });
    }
    if (!persist()) $("err").textContent = "이 브라우저에서는 저장할 수 없어요. 사진 용량이 크면 지우고 다시 시도해 보세요.";
    currentMonth = monthKey(date);
    resetForm();
    render();
  }

  function startEdit(id) {
    var e = entries.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    editingId = id;
    $("f-date").value = e.date;
    $("f-text").value = e.text || "";
    $("f-video").value = e.video || "";
    setPending(e.photo || null);
    $("form").classList.add("editing");
    $("save").textContent = "수정 저장";
    $("cancel").hidden = false;
    $("form").scrollIntoView({ block: "start" });
    $("f-text").focus();
  }

  /* ---------- download / backup ---------- */
  function dlMsg(m) { $("dl-msg").textContent = m || ""; }
  function saveFile(filename, content, mime) {
    if (!entries.length) { dlMsg("저장된 기록이 아직 없어요."); return; }
    try {
      var url = URL.createObjectURL(new Blob([content], { type: mime }));
      var a = document.createElement("a");
      a.href = url; a.download = filename;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      dlMsg("저장했어요. 다운로드 폴더를 확인해 보세요.");
    } catch (err) { dlMsg("저장하지 못했어요. 아래 백업 · 복원으로 내용을 복사해 두세요."); }
  }
  $("dl-json").addEventListener("click", function () {
    saveFile("단상 백업.json", JSON.stringify(entries, null, 2), "application/json");
  });

  function backupMsg(m) { $("backup-msg").textContent = m; }
  $("export").addEventListener("click", function () {
    var ta = $("backup-text");
    ta.value = JSON.stringify(entries, null, 2);
    ta.focus(); ta.select();
    backupMsg("내용을 전체 복사해서 메모장 등에 보관하세요.");
  });
  $("import").addEventListener("click", function () {
    var raw = $("backup-text").value.trim();
    if (!raw) { backupMsg("붙여넣은 내용이 없어요."); return; }
    try {
      var data = JSON.parse(raw);
      if (!Array.isArray(data)) throw new Error("형식 오류");
      var have = {};
      entries.forEach(function (e) { have[e.id] = true; });
      var added = 0;
      data.forEach(function (d) {
        if (d && typeof d.date === "string" && d.id && !have[d.id]) {
          entries.push({
            id: d.id, date: d.date,
            text: typeof d.text === "string" ? d.text : "",
            video: typeof d.video === "string" ? d.video : "",
            photo: typeof d.photo === "string" ? d.photo : null,
            created: d.created || Date.now()
          });
          added++;
        }
      });
      persist(); render();
      backupMsg(added + "개를 추가했어요.");
    } catch (e) {
      backupMsg("내용을 읽을 수 없어요. 내보내기로 받은 내용 그대로 붙여넣었는지 확인해 주세요.");
    }
  });

  /* ---------- events ---------- */
  $("save").addEventListener("click", save);
  $("cancel").addEventListener("click", resetForm);
  $("f-text").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); save(); }
  });
  $("month-btn").addEventListener("click", function () {
    if ($("month-menu").hidden) openMonthMenu(); else closeMonthMenu();
  });
  document.addEventListener("click", function (ev) {
    if (!ev.target.closest(".month-bar")) closeMonthMenu();
  });
  document.addEventListener("keydown", function (ev) { if (ev.key === "Escape") closeMonthMenu(); });

  load();
  currentMonth = monthKey(todayStr());
  resetForm();
  render();
})();
</script>
</body>
</html>
